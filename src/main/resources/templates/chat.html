<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
    <script>
        tailwind.config={
            theme:{
                extend:{
                    animation:{
                        "float":"float 6s ease-in-out infinite",
                        "message":"message .3s ease-out"
                    },
                    keyframes:{
                        float:{
                            "0%,100%":{transform:"translateY(0)"},
                            "50%":{transform:"translateY(-15px)"}
                        },
                        message:{
                            "0%":{opacity:"0",transform:"translateY(10px)"},
                            "100%":{opacity:"1",transform:"translateY(0)"}
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-[#050816] text-white overflow-x-hidden">
<div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-48 -left-32 w-[500px] h-[500px] bg-violet-600/20 rounded-full blur-[130px] animate-float"></div>
    <div class="absolute top-1/3 -right-40 w-[500px] h-[500px] bg-cyan-500/15 rounded-full blur-[130px]"></div>
    <div class="absolute -bottom-48 left-1/3 w-[500px] h-[500px] bg-fuchsia-600/10 rounded-full blur-[130px]"></div>
</div>
<div class="relative min-h-screen flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-5xl">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-5 mb-6">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-500 to-cyan-400 flex items-center justify-center shadow-xl shadow-violet-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-3.21-.53L4 21l1.53-3.82A7.96 7.96 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Real-Time Chat Application</h1>
                    <p class="text-sm text-slate-400 mt-1">Connect and communicate in real time</p>
                </div>
            </div>
            <div id="connectionStatus" class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/[0.05] border border-white/10 backdrop-blur-xl">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse"></span>
                <span id="statusText" class="text-sm text-slate-400">Connecting...</span>
            </div>
        </div>
        <div class="rounded-3xl border border-white/10 bg-white/[0.045] backdrop-blur-2xl shadow-2xl shadow-black/50 overflow-hidden">
            <div class="h-1 bg-gradient-to-r from-violet-500 via-fuchsia-500 to-cyan-400"></div>
            <div class="px-5 sm:px-7 py-4 border-b border-white/10 bg-white/[0.025] flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-violet-500/20 to-cyan-400/20 border border-white/10 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-cyan-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </div>
                        <span class="absolute -right-1 -bottom-1 w-3 h-3 rounded-full bg-emerald-400 border-2 border-[#111827]"></span>
                    </div>
                    <div>
                        <h2 class="font-semibold">Live Chat</h2>
                        <p class="text-xs text-slate-500">Real-time messaging</p>
                    </div>
                </div>
                <div class="hidden sm:block text-xs text-slate-500">STOMP • WebSocket</div>
            </div>
            <div id="chat" class="h-[420px] sm:h-[480px] overflow-y-auto p-5 sm:p-7 space-y-4">
                <div id="emptyChat" class="h-full flex flex-col items-center justify-center text-center">
                    <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-violet-500/10 to-cyan-400/10 border border-white/10 flex items-center justify-center mb-5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-3.21-.53L4 21l1.53-3.82A7.96 7.96 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-300">Start a conversation</h3>
                    <p class="text-sm text-slate-500 max-w-sm mt-2">Type your name and message below to start chatting in real time.</p>
                </div>
            </div>
            <div class="border-t border-white/10 bg-black/10 p-5 sm:p-7">
                <div class="mb-4">
                    <label for="senderInput" class="block text-xs font-medium text-slate-400 mb-2">Your name</label>
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <input id="senderInput" type="text" class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-white/[0.055] border border-white/10 text-white placeholder-slate-600 outline-none focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/10 transition" placeholder="Your name ...">
                    </div>
                </div>
                <div>
                    <label for="messageInput" class="block text-xs font-medium text-slate-400 mb-2">Message</label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input id="messageInput" type="text" class="flex-1 px-4 py-3.5 rounded-xl bg-white/[0.055] border border-white/10 text-white placeholder-slate-600 outline-none focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/10 transition" placeholder="Type your message here...">
                        <button id="sendMessage" disabled class="px-7 py-3.5 rounded-xl font-semibold bg-gradient-to-r from-violet-600 to-cyan-500 shadow-lg shadow-violet-500/20 hover:shadow-violet-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100">
<span class="flex items-center justify-center gap-2">
Send
<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-6-6 6 6-6 6"/>
</svg>
</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-center gap-2 mt-5 text-xs text-slate-600">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            Real-time communication
        </div>
    </div>
</div>
<script>
    let stompClient=null;
    function setConnected(connected){
        const button=document.getElementById('sendMessage');
        const statusDot=document.getElementById('statusDot');
        const statusText=document.getElementById('statusText');
        button.disabled=!connected;
        if(connected){
            statusDot.className="w-2.5 h-2.5 rounded-full bg-emerald-400";
            statusText.textContent="Websocket/Stomp Connected ";
            statusText.className="text-sm text-emerald-400";
        }else{
            statusDot.className="w-2.5 h-2.5 rounded-full bg-red-400";
            statusText.textContent="Websocket/Stomp Disconnected";
            statusText.className="text-sm text-red-400";
        }
    }
    function connect(){
        stompClient=new StompJs.Client({
            webSocketFactory:()=>new SockJS('/chat'),
            onConnect:function(frame){
                console.log("Connected: "+frame);
                setConnected(true);
                stompClient.subscribe('/topic/message',function(message){
                    showMessage(JSON.parse(message.body));
                });
            },
            onStompError:function(frame){
                console.error("STOMP error:",frame);
                setConnected(false);
            },
            onWebSocketError:function(error){
                console.error("WebSocket error:",error);
                setConnected(false);
            }
        });
        stompClient.activate();
    }
    function showMessage(message){
        const chat=document.getElementById('chat');
        const emptyChat=document.getElementById('emptyChat');
        if(emptyChat) emptyChat.remove();
        const messageElement=document.createElement('div');
        messageElement.className="flex items-start gap-3 animate-message";
        messageElement.innerHTML=`<div class="flex-shrink-0 w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-cyan-400 flex items-center justify-center text-xs font-bold">${escapeHtml(message.sender.charAt(0).toUpperCase())}</div><div class="max-w-[80%] rounded-2xl rounded-tl-md bg-white/[0.06] border border-white/10 px-4 py-3"><div class="text-xs font-semibold text-cyan-300 mb-1">${escapeHtml(message.sender)}</div><div class="text-[15px] sm:text-base text-slate-200 break-words leading-relaxed">${escapeHtml(message.content)}</div></div>`;        chat.appendChild(messageElement);
        console.log(message.sender+': '+message.content);
        chat.scrollTop=chat.scrollHeight;
    }
    function sendMessage(){
        const sender=document.getElementById('senderInput').value;
        const content=document.getElementById('messageInput').value;
        if(!sender.trim()||!content.trim()) return;
        const chatMessage={sender:sender,content:content};
        stompClient.publish({destination:'/app/sendMessage',body:JSON.stringify(chatMessage)});
        document.getElementById('messageInput').value='';
    }
    function escapeHtml(value){
        const div=document.createElement('div');
        div.textContent=value;
        return div.innerHTML;
    }
    document.getElementById('sendMessage').onclick=sendMessage;
    document.getElementById('messageInput').addEventListener('keydown',function(event){
        if(event.key==='Enter') sendMessage();
    });
    window.onload=connect;
</script>
</body>
</html>
